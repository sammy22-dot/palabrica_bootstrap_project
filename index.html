<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <button class="btn btn-sm btn-light" id="sidebarToggle" aria-expanded="true"
            aria-label="Toggle Sidebar">☰</button>
        <span class="navbar-brand mb-0 h5">Dashboard</span>
    </nav>
    <!-- Dashboard container -->
    <div class="container-fluid dashboard d-flex p-0">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3 d-flex flex-column">
            <div class="sidebar-profile text-center">
                <img src="https://sammy22-dot.github.io/activiity_2/sample.png" class="profile-img" alt="Profile">
                <div class="profile-info">
                    <h6 class="mb-0">Sam Lloyd Chavez</h6>
                    <small class="text-muted">Administrator</small>
                </div>
            </div>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link active" href="#" aria-current="page">
                        <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-file-earmark-text"></i> <span>Reports</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-people"></i> <span>Users</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear"></i> <span>Settings</span>
                    </a>
                </li>
            </ul>
            <div class="mt-auto">
                <a class="nav-link text-danger" href="/logout">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </div>

        <!-- Main content -->
        <div class="main p-4 overflow-auto">
            <h3 class="mb-4 ">Overview</h3>

            <!-- Stats Cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-lg-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="stat-title">Total Sales</div>
                            <div class="stat-value h4" id="totalSales">₱0</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="stat-title">Users</div>
                            <div class="stat-value h4" id="totalUsers">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="stat-title">Orders</div>
                            <div class="stat-value h4" id="totalOrders">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="stat-title">Revenue</div>
                            <div class="stat-value h4" id="totalRevenue">₱0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="mb-3">Sales Chart</h6>
                            <div class="chart-container"><canvas id="salesChart"></canvas></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6 class="mb-3">Users Growth</h6>
                            <div class="chart-container"><canvas id="usersChart"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- JS -->
    <script src="index.js"></script>
</body>

</html>
